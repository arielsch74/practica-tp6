server {
    listen 80;

    # SPA: estáticos con fallback a index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas a /api se proxean al backend por la red interna de compose.
    # Acá SÍ vale el nombre de servicio: nginx corre DENTRO de la red — y al ser
    # same-origin para el browser, evita CORS (ver TP2 §2.6).
    #
    # 🔴 El nombre va en una VARIABLE, y no escrito directo en el proxy_pass. Con
    # el nombre escrito directo, nginx lo resuelve AL ARRANCAR y, si todavía no
    # existe, se niega a levantar: «host not found in upstream». O sea que el
    # contenedor del frontend no podría correr solo — solo dentro del compose.
    # Con una variable, nginx resuelve recién cuando llega un pedido: el sitio
    # levanta siempre, y si el backend no está, esa llamada devuelve 502.
    # 🔴 UN SOLO resolver, y es el de Docker. Poner un DNS público de respaldo
    # (8.8.8.8) parece prudente y es exactamente lo contrario: nginx reparte las
    # consultas entre TODOS los resolvers de la lista, y 8.8.8.8 no sabe nada de
    # un nombre de servicio de compose — devuelve NXDOMAIN y la llamada muere en
    # 502. El síntoma es un 502 INTERMITENTE, con todo levantado y sano, que no
    # se arregla esperando. Estuvo así y se filmó tres veces.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;
    }
}
